[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[dev]
  command = "npm start"
  port = 8888
  targetPort = 3000
  publish = "public"
  autoLaunch = false

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions."fetch-weather"]
  schedule = "*/30 * * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
